<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        connect-src 'self';
        img-src 'self' data:;
        font-src 'self';
    ">
    <title>Imap Konten</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
    <!-- Eigene Styles -->
    <link rel="stylesheet" href="css/styles.min.css">
</head>

<body class="h-100">
    <div class="container-fluid h-100 p-0">
        <div class="row g-0 text-start h-100">

            <div class="col-3 col-md-2 p-3">
                <div class="card h-100">
                    <div class="card-body">
                        <ul id="noteList" class="list-group"></ul>
                    </div>
                </div>
            </div>

            <div class="col-sm-9 col-md-10 p-3 ps-0">
                <div class="card h-100">
                    <form id="imapForm">
                        <div class="card-header">
                            <div class="form-group">
                                <div class="mb-3">
                                    <label for="AccountName1" class="form-label">Account Name</label>
                                    <div class="input-group mb-3">
                                        <span class="input-group-text" id="basic-addon1"><i class="bi bi-clipboard-plus"></i></span>
                                        <input id="AccountName1" type="text" class="form-control" placeholder="Notes on example.com">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card-body">
                            <label for="ServerData1" class="form-label">Server[imap.example.com] : Port[993]</label>
                            <div class="input-group mb-3">
                                <span class="input-group-text" id="basic-addon1"><i class="bi bi-server"></i></span>
                                <input is="ServerData1" type="text" class="form-control" placeholder="imap.example.com:993">
                            </div>
                            <label for="InputEmail1" class="form-label">User</label>
                            <div class="input-group mb-3">
                                <span class="input-group-text" id="basic-addon1"><i class="bi bi-at"></i></span>
                                <input is="InputEmail1" type="email" class="form-control" aria-describedby="emailHelp" placeholder="user@example.com">
                            </div>
                            <label for="InputPassword1" class="form-label">Password</label>
                            <div class="input-group mb-3">
                                <span class="input-group-text" id="basic-addon1"><i class="bi bi-pass"></i></span>
                                <input id="InputPassword1" type="password" class="form-control" placeholder="*** long and secret password ***">
                            </div>
                            <div class="d-flex justify-content-end me-5">
                                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i>&nbsp;Speichern</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
