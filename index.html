<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Notes App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <!-- Eigene Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="h-100">

    <div class="container-fluid h-100 p-0">
        <div class="row g-0 text-center h-100">

            <div class="col-3 col-md-2 p-3">
                <div class="card h-100">
                    <div class="card-body">
                        <ul id="noteList" class="list-group"></ul>
                    </div>
                </div>
            </div>
            <div class="col-sm-9 col-md-10 p-3 ps-0">
                <div class="card h-100">
                    <div class="card-header">
                        <input type="text" class="w-100 h-100" id="noteTitle" placeholder="Schreibe den Titel der Notitz...">
                        </div>
                    <div class="card-body">
                        <textarea class="w-100 h-100" id="noteInput" placeholder="Schreibe deine Notiz..."></textarea>
                    </div>
                </div>
            </div>

        </div>



    </div>



    <!-- Bootstrap JavaScript (optional, nur wenn du interaktive Komponenten wie Modals brauchst) -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="renderer.js"></script>
